# Use C-a as prefix, and C-a C-a sends prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g status-interval 1

# Vi keybindings
set -g status-keys vi
set -g mode-keys vi

# Keybindings
bind -n C-x set synchronize-panes
bind - split-window -v
bind | split-window -h

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Window indexing
set -g base-index 1

# Reload config
bind R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# Mouse
set -g mouse on

# Activity notifications
set -g monitor-activity on
set -g visual-activity on

# Instant key response
set -g repeat-time 0

# Status bar on top and transparent
set -g status-position top
set -g status-style "bg=default,fg=#c5c9c5"

# Copy without jumping to bottom after leaving copy mode
set-window-option -g mode-keys vi
bind -T copy-mode-vi y send -X copy-selection
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line

# Add modes the status bar - NORMAL | COPY | ZOOM | SYNC
set -g status-left-length 60
set -g status-left '#{?synchronize-panes,#[fg=#E69A9A]SYNC ,}#{?window_zoomed_flag,#[fg=#E6C384]ZOOM ,}#{?pane_in_mode,#[fg=#7AA89F]COPY ,}'

# Use git info in right status
set -g status-right '#(gitmux "#{pane_current_path}")'

# Window list
set -g window-status-format " #[fg=#4e4d4c]#I #[fg=#4e4d4c]#W "
set -g window-status-current-format "#[fg=#ffa066]#I #[fg=#c5c9c5,bold]#W"

# Pane borders
set -g pane-border-style "fg=#2e2d2c"
set -g pane-active-border-style "fg=#2e2d2c"
set -g pane-border-lines single

# Copy mode colors
setw -g mode-style "bg=#2e2d2c,fg=#c5c9c5"
setw -g mode-selection-style "bg=#2e2d2c,fg=#c5c9c5"
set -g copy-mode-match-style "bg=#8ea4a2,fg=black"
set -g copy-mode-current-match-style "bg=#E6C384,fg=black,bold"

# Messages
set -g message-style "bg=default,fg=#938AA9"
set -g message-command-style "bg=default,fg=#c5c9c5"

