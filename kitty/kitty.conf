# Font
font_family      JetBrainsMono Nerd Font
font_size        14.0

# Window appearance
background       #0f0f0f
foreground       #d0d0d0
cursor           #c0c0c0
cursor_shape     block
hide_window_decorations yes

# Padding and margins
window_padding_width 0

# Tabs (minimal style)
tab_bar_min_tabs 0
tab_bar_edge top
tab_bar_style powerline
tab_title_template "{index}"
tab_powerline_style angled
active_tab_foreground   #ffffff
active_tab_background   #5a5a5a
inactive_tab_foreground #aaaaaa
inactive_tab_background #1a1a1a

enable_audio_bell no

# Scrollback
scrollback_lines 300000

# Theme
background            #202020
foreground            #d0d0d0
cursor                #d0d0d0
selection_background  #303030
color0                #151515
color8                #505050
color1                #ac4142
color9                #ac4142
color2                #7e8d50
color10               #7e8d50
color3                #e5b566
color11               #e5b566
color4                #6c99ba
color12               #6c99ba
color5                #9e4e85
color13               #9e4e85
color6                #7dd5cf
color14               #7dd5cf
color7                #d0d0d0
color15               #f5f5f5
selection_foreground #202020

# Use nvim as the pager. Remove all ASCII formatting characters.
scrollback_pager nvim -c 'set buftype=nofile' -c 'set noswapfile' -c 'silent! %s/\%x1b\[[0-9;]*[sumJK]//g' -c 'silent! %s/\%x1b]133;[A-Z]\%x1b\\//g' -c 'silent! %s/\%x1b\[[^m]*m//g' -c 'silent! %s///g' -

